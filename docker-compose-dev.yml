# Docker Compose untuk Deployment Server (1 Container: Nginx Ubuntu 24.04 + Live Snapshot JSON API)
# Jalankan di server: docker compose -f docker-compose-dev.yml up -d --build
services:
  timah-csr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timah-csr-server
    restart: unless-stopped
    ports:
      - "5000:80"
    volumes:
      - ./data:/app/data
